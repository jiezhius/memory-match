<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆翻牌</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --card-back: #334155;
    --card-back-hover: #3f4f68;
    --accent: #38bdf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --matched: #22c55e33;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
    transition: background 0.6s ease;
  }
  body[data-theme="1"] { background: linear-gradient(135deg, #1e1b4b, #4c1d55); --accent: #c084fc; }
  body[data-theme="2"] { background: linear-gradient(135deg, #052e26, #064e3b); --accent: #34d399; }
  body[data-theme="3"] { background: linear-gradient(135deg, #451a03, #7c2d12); --accent: #fb923c; }
  body[data-theme="4"] { background: linear-gradient(135deg, #1e1b4b, #1e3a8a); --accent: #818cf8; }
  body[data-theme="5"] { background: linear-gradient(135deg, #4c0519, #831843); --accent: #fb7185; }
  h1 {
    margin: 0 0 0.25rem;
    font-size: 1.75rem;
  }
  .subtitle {
    color: var(--muted);
    margin: 0 0 1.5rem;
    font-size: 0.9rem;
  }
  .panel {
    background: var(--panel);
    border-radius: 16px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
    display: flex;
    gap: 1.5rem;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
  }
  .stat { text-align: center; }
  .stat .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .value { font-size: 1.4rem; font-weight: 600; }
  select, button {
    font-family: inherit;
    font-size: 0.9rem;
    border: none;
    border-radius: 8px;
    padding: 0.5rem 0.9rem;
    cursor: pointer;
  }
  select {
    background: var(--card-back);
    color: var(--text);
  }
  button.primary {
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.1); }
  button.icon-btn {
    background: var(--card-back);
    color: var(--text);
    font-size: 1rem;
    padding: 0.5rem 0.7rem;
  }
  button.icon-btn:hover { filter: brightness(1.15); }

  .board {
    display: grid;
    gap: 10px;
    perspective: 800px;
  }
  .card {
    width: 80px;
    height: 80px;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.4s;
  }
  .card.flipped, .card.matched { transform: rotateY(180deg); }
  .card .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    backface-visibility: hidden;
  }
  .card .front {
    background: var(--card-back);
    transition: background 0.2s;
  }
  .card:not(.flipped):not(.matched):hover .front {
    background: var(--card-back-hover);
  }
  .card .back {
    background: #0b1220;
    transform: rotateY(180deg);
  }
  .card.matched .back {
    background: var(--matched);
    box-shadow: inset 0 0 0 2px #22c55e;
  }
  .card.matched {
    animation: pop 0.35s ease;
  }
  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.12); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  .card.wrong .front {
    animation: shake 0.35s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .win-overlay.show { display: flex; }
  .win-card {
    background: var(--panel);
    border-radius: 16px;
    padding: 2rem 2.5rem;
    text-align: center;
    max-width: 320px;
  }
  .win-card h2 { margin-top: 0; }
  .win-card .best { color: var(--accent); font-weight: 600; }

  footer {
    margin-top: 2rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
  <h1>🧠 记忆翻牌</h1>
  <p class="subtitle">找出所有配对，越快越好</p>

  <div class="panel">
    <div class="stat">
      <div class="label">关卡</div>
      <div class="value" id="level">1</div>
    </div>
    <div class="stat">
      <div class="label">用时</div>
      <div class="value" id="timer">00:00</div>
    </div>
    <div class="stat">
      <div class="label">步数</div>
      <div class="value" id="moves">0</div>
    </div>
    <div class="stat">
      <div class="label">最佳成绩</div>
      <div class="value" id="best">--</div>
    </div>
    <select id="difficulty">
      <option value="4x3">简单 (4x3)</option>
      <option value="4x4" selected>普通 (4x4)</option>
      <option value="6x4">困难 (6x4)</option>
    </select>
    <button class="primary" id="restart">重新开始</button>
    <button class="icon-btn" id="muteBtn" title="静音/取消静音">🔊</button>
  </div>

  <div class="board" id="board"></div>

  <footer>提示：连续答对不清空计次，比比看谁步数更少</footer>

  <div class="win-overlay" id="winOverlay">
    <div class="win-card">
      <h2>🎉 完成！</h2>
      <p>用时 <span id="finalTime"></span>，共 <span id="finalMoves"></span> 步</p>
      <p class="best" id="newBest"></p>
      <button class="primary" id="playAgain">下一关</button>
    </div>
  </div>

<script>
const EMOJIS = [
  "🐼","🐶","🐱","🐰","🦊","🐨","🐯","🦁","🐮","🐷","🐸","🐵",
  "🐔","🐧","🦄","🐻","🐹","🦋","🐝","🐳","🐬","🦖","🐙","🐢",
  "🍎","🍌","🍇","🍉","🍓","🍑","🥝","🍍",
];
const LEVEL_TIERS = [{ cols: 4, rows: 3 }, { cols: 4, rows: 4 }, { cols: 6, rows: 4 }];
const THEME_COUNT = 6;

const board = document.getElementById('board');
const movesEl = document.getElementById('moves');
const timerEl = document.getElementById('timer');
const bestEl = document.getElementById('best');
const levelEl = document.getElementById('level');
const difficultySelect = document.getElementById('difficulty');
const restartBtn = document.getElementById('restart');
const muteBtn = document.getElementById('muteBtn');
const winOverlay = document.getElementById('winOverlay');
const finalTimeEl = document.getElementById('finalTime');
const finalMovesEl = document.getElementById('finalMoves');
const newBestEl = document.getElementById('newBest');
const playAgainBtn = document.getElementById('playAgain');

let state = {
  cols: 4, rows: 4,
  level: 1,
  tierIndex: 1,
  cards: [],
  flipped: [],
  matchedCount: 0,
  moves: 0,
  seconds: 0,
  timerId: null,
  started: false,
  locked: false,
  muted: localStorage.getItem('memory-match-muted') === '1',
};

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, startTime, duration, type = 'sine', volume = 0.15) {
  if (state.muted) return;
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(volume, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

function playFlip() {
  playTone(520, 0, 0.08, 'square', 0.06);
}

function playMatch() {
  playTone(880, 0, 0.12, 'triangle', 0.12);
  playTone(1175, 0.1, 0.16, 'triangle', 0.12);
}

function playWin() {
  [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
    playTone(freq, i * 0.12, 0.18, 'triangle', 0.14);
  });
}

function updateMuteBtn() {
  muteBtn.textContent = state.muted ? '🔇' : '🔊';
}

function applyTheme(level) {
  document.body.dataset.theme = String((level - 1) % THEME_COUNT);
}

function bestKey() {
  return `memory-match-best-${state.cols}x${state.rows}`;
}

function formatTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const sec = (s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function loadBest() {
  const val = localStorage.getItem(bestKey());
  bestEl.textContent = val ? formatTime(Number(val)) : '--';
}

function saveBestIfNeeded() {
  const key = bestKey();
  const prev = localStorage.getItem(key);
  if (!prev || state.seconds < Number(prev)) {
    localStorage.setItem(key, String(state.seconds));
    return true;
  }
  return false;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startTimer() {
  stopTimer();
  state.timerId = setInterval(() => {
    state.seconds++;
    timerEl.textContent = formatTime(state.seconds);
  }, 1000);
}

function stopTimer() {
  if (state.timerId) clearInterval(state.timerId);
  state.timerId = null;
}

function buildBoard() {
  const { cols, rows } = LEVEL_TIERS[state.tierIndex];
  state.cols = cols;
  state.rows = rows;
  state.cards = [];
  state.flipped = [];
  state.matchedCount = 0;
  state.moves = 0;
  state.seconds = 0;
  state.started = false;
  state.locked = false;
  stopTimer();
  movesEl.textContent = '0';
  timerEl.textContent = '00:00';
  levelEl.textContent = state.level;
  winOverlay.classList.remove('show');
  loadBest();
  applyTheme(state.level);

  const totalPairs = (cols * rows) / 2;
  const symbols = shuffle([...EMOJIS]).slice(0, totalPairs);
  const deck = shuffle([...symbols, ...symbols]);

  board.style.gridTemplateColumns = `repeat(${cols}, 80px)`;
  board.innerHTML = '';

  deck.forEach((symbol, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.symbol = symbol;
    card.dataset.index = idx;
    card.innerHTML = `
      <div class="face front"></div>
      <div class="face back">${symbol}</div>
    `;
    card.addEventListener('click', () => onCardClick(card));
    board.appendChild(card);
    state.cards.push(card);
  });
}

function setupGame() {
  const [cols, rows] = difficultySelect.value.split('x').map(Number);
  const idx = LEVEL_TIERS.findIndex(t => t.cols === cols && t.rows === rows);
  state.tierIndex = idx === -1 ? 0 : idx;
  state.level = 1;
  buildBoard();
}

function nextLevel() {
  state.level++;
  state.tierIndex = Math.min(state.tierIndex + 1, LEVEL_TIERS.length - 1);
  buildBoard();
}

function onCardClick(card) {
  if (state.locked) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (state.flipped.length === 2) return;

  if (!state.started) {
    state.started = true;
    startTimer();
  }

  card.classList.add('flipped');
  state.flipped.push(card);
  playFlip();

  if (state.flipped.length === 2) {
    state.moves++;
    movesEl.textContent = state.moves;
    const [a, b] = state.flipped;
    if (a.dataset.symbol === b.dataset.symbol) {
      a.classList.add('matched');
      b.classList.add('matched');
      playMatch();
      state.matchedCount += 2;
      state.flipped = [];
      if (state.matchedCount === state.cards.length) {
        onWin();
      }
    } else {
      state.locked = true;
      setTimeout(() => {
        a.classList.add('wrong');
        b.classList.add('wrong');
      }, 50);
      setTimeout(() => {
        a.classList.remove('flipped', 'wrong');
        b.classList.remove('flipped', 'wrong');
        state.flipped = [];
        state.locked = false;
      }, 700);
    }
  }
}

function onWin() {
  stopTimer();
  playWin();
  finalTimeEl.textContent = formatTime(state.seconds);
  finalMovesEl.textContent = state.moves;
  const isNewBest = saveBestIfNeeded();
  newBestEl.textContent = isNewBest ? '🏆 新纪录！' : '';
  loadBest();
  setTimeout(() => winOverlay.classList.add('show'), 400);
}

restartBtn.addEventListener('click', setupGame);
playAgainBtn.addEventListener('click', nextLevel);
difficultySelect.addEventListener('change', setupGame);
muteBtn.addEventListener('click', () => {
  state.muted = !state.muted;
  localStorage.setItem('memory-match-muted', state.muted ? '1' : '0');
  updateMuteBtn();
});

updateMuteBtn();
setupGame();
</script>
</body>
</html>
