<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>记忆翻牌</title>
<style>
  :root {
    --bg: linear-gradient(135deg, #7dd3fc, #bae6fd);
    --panel: #1e293b;
    --card-back: #334155;
    --card-back-hover: #3f4f68;
    --accent: #0ea5e9;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --matched: #22c55e33;
    --on-bg: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--on-bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem 3rem;
    transition: background 0.6s ease;
    position: relative;
    overflow-x: hidden;
  }
  body[data-theme="1"] { background: linear-gradient(135deg, #fde68a, #fdba74); --accent: #f59e0b; }
  body[data-theme="2"] { background: linear-gradient(135deg, #86efac, #5eead4); --accent: #10b981; }
  body[data-theme="3"] { background: linear-gradient(135deg, #fbcfe8, #f9a8d4); --accent: #ec4899; }
  body[data-theme="4"] { background: linear-gradient(135deg, #c4b5fd, #a5b4fc); --accent: #8b5cf6; }
  body[data-theme="5"] { background: linear-gradient(135deg, #fecaca, #fdba74); --accent: #f43f5e; }
  h1 {
    margin: 0 0 0.25rem;
    font-size: 1.75rem;
    position: relative;
    z-index: 2;
  }
  .subtitle {
    color: var(--on-bg);
    opacity: 0.75;
    margin: 0 0 1.5rem;
    font-size: 0.9rem;
    position: relative;
    z-index: 2;
  }
  .panel {
    background: var(--panel);
    color: var(--text);
    border-radius: 16px;
    padding: 1.25rem 1.5rem;
    margin-bottom: 1.5rem;
    display: flex;
    gap: 1.5rem;
    align-items: center;
    flex-wrap: wrap;
    justify-content: center;
    position: relative;
    z-index: 2;
  }
  .stat { text-align: center; }
  .stat .label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .stat .value { font-size: 1.4rem; font-weight: 600; }
  select, button {
    font-family: inherit;
    font-size: 0.9rem;
    border: none;
    border-radius: 8px;
    padding: 0.5rem 0.9rem;
    cursor: pointer;
  }
  select {
    background: var(--card-back);
    color: var(--text);
  }
  button.primary {
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.1); }
  button.icon-btn {
    background: var(--card-back);
    color: var(--text);
    font-size: 1rem;
    padding: 0.5rem 0.7rem;
  }
  button.icon-btn:hover { filter: brightness(1.15); }

  .board {
    display: grid;
    gap: 10px;
    perspective: 800px;
    position: relative;
    z-index: 2;
  }
  .card {
    width: 80px;
    height: 80px;
    position: relative;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.4s;
  }
  .card.flipped, .card.matched { transform: rotateY(180deg); }
  .card .face {
    position: absolute;
    inset: 0;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2rem;
    backface-visibility: hidden;
  }
  .card .front {
    background: var(--card-back);
    transition: background 0.2s;
  }
  .card:not(.flipped):not(.matched):hover .front {
    background: var(--card-back-hover);
  }
  .card .back {
    background: #0b1220;
    transform: rotateY(180deg);
  }
  .card.matched .back {
    background: var(--matched);
    box-shadow: inset 0 0 0 2px #22c55e;
  }
  .card.matched {
    animation: pop 0.35s ease;
  }
  @keyframes pop {
    0% { transform: rotateY(180deg) scale(1); }
    50% { transform: rotateY(180deg) scale(1.12); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  .card.wrong .front {
    animation: shake 0.35s;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .win-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .win-overlay.show { display: flex; }
  .win-card {
    background: var(--panel);
    color: var(--text);
    border-radius: 16px;
    padding: 2rem 2.5rem;
    text-align: center;
    max-width: 320px;
  }
  .win-card h2 { margin-top: 0; }
  .win-card .best { color: var(--accent); font-weight: 600; }

  footer {
    margin-top: 2rem;
    color: var(--on-bg);
    opacity: 0.75;
    font-size: 0.8rem;
    position: relative;
    z-index: 2;
  }

  .critter-lane {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 110px;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .critter {
    position: absolute;
    bottom: 4px;
    animation: walk-across linear infinite;
    will-change: transform;
  }
  .critter-face {
    display: inline-block;
    animation: hop ease-in-out infinite;
    transform-origin: bottom center;
  }
  @keyframes walk-across {
    from { transform: translateX(-20vw); }
    to { transform: translateX(120vw); }
  }
  @keyframes hop {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    25% { transform: translateY(-18px) rotate(-8deg); }
    50% { transform: translateY(-26px) rotate(0deg); }
    75% { transform: translateY(-18px) rotate(8deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .critter, .critter-face { animation: none; display: none; }
  }
</style>
</head>

let state = {
  cols: 4, rows: 4,
  level: 1,
  tierIndex: 1,
  cards: [],
  flipped: [],
  matchedCount: 0,
  moves: 0,
  seconds: 0,
  timerId: null,
  started: false,
  locked: false,
  muted: localStorage.getItem('memory-match-muted') === '1',
  lang: 'en',
};

function detectLanguage() {
  const saved = localStorage.getItem('memory-match-lang');
  if (saved && I18N[saved]) return saved;
  const navLangs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
  for (const raw of navLangs) {
    const lower = raw.toLowerCase();
    if (lower.startsWith('zh')) {
      return /tw|hk|mo/.test(lower) ? 'zh-TW' : 'zh-CN';
    }
    const base = lower.split('-')[0];
    if (I18N[base]) return base;
  }
  return 'en';
}

function populateLanguageSelect() {
  LANGS.forEach(l => {
    const opt = document.createElement('option');
    opt.value = l.code;
    opt.textContent = l.name;
    languageSelect.appendChild(opt);
  });
}

function applyI18n() {
  const dict = I18N[state.lang] || I18N.en;
  document.documentElement.lang = state.lang;
  document.documentElement.dir = state.lang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = dict[el.dataset.i18n];
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = dict[el.dataset.i18nTitle];
  });
  updateTitleBar();
}

function pickMascot() {
  return ANIMAL_POOL[Math.floor(Math.random() * ANIMAL_POOL.length)];
}

function updateTitleBar() {
  const dict = I18N[state.lang] || I18N.en;
  document.title = `${mascotIconEl.textContent} ${dict.title}`;
}

function buildCritterLane(container, count) {
  container.innerHTML = '';
  for (let i = 0; i < count; i++) {
    const critter = document.createElement('span');
    critter.className = 'critter';
    const duration = 10 + Math.random() * 8;
    const delay = -Math.random() * duration;
    const size = 2.6 + Math.random() * 1.4;
    critter.style.animationDuration = `${duration}s`;
    critter.style.animationDelay = `${delay}s`;
    critter.style.fontSize = `${size}rem`;

    const face = document.createElement('span');
    face.className = 'critter-face';
    face.textContent = CRITTERS[Math.floor(Math.random() * CRITTERS.length)];
    const hopDuration = 0.45 + Math.random() * 0.35;
    face.style.animationDuration = `${hopDuration}s`;
    face.style.animationDelay = `${-Math.random() * hopDuration}s`;

    critter.appendChild(face);
    container.appendChild(critter);
  }
}

function initCritterLanes() {
  buildCritterLane(critterLane, 6);
}

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playTone(freq, startTime, duration, type = 'sine', volume = 0.15) {
  if (state.muted) return;
  const ctx = getAudioCtx();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  const t0 = ctx.currentTime + startTime;
  gain.gain.setValueAtTime(0, t0);
  gain.gain.linearRampToValueAtTime(volume, t0 + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t0);
  osc.stop(t0 + duration + 0.02);
}

function playFlip() {
  playTone(520, 0, 0.08, 'square', 0.06);
}

function playMatch() {
  playTone(880, 0, 0.12, 'triangle', 0.12);
  playTone(1175, 0.1, 0.16, 'triangle', 0.12);
}

function playWin() {
  [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
    playTone(freq, i * 0.12, 0.18, 'triangle', 0.14);
  });
}

function updateMuteBtn() {
  muteBtn.textContent = state.muted ? '🔇' : '🔊';
}

// Ad/analytics SDKs for HTML5 game portals (CrazyGames, Poki, GameDistribution).
// CrazyGames/Poki are defensive by design: outside their own hosting iframe
// their SDKs either never attach to `window` or safely no-op. GameDistribution
// is not — if it sees a domain that isn't registered for this game ID, it
// force-redirects the entire top-level page to a "Blocked" page. So its SDK
// is only ever loaded when we're actually being served from *.gamedistribution.com;
// everywhere else (GitHub Pages, itch.io, this file opened directly) it's
// simply never fetched, and the rest of this file's `window.gdsdk` checks
// stay false — no code path changes, just no live GD script.
const GD_GAME_ID = 'df02e8f6aec84afdb3bbac127132baaa';
const ON_GAMEDISTRIBUTION = /(^|\.)gamedistribution\.com$/.test(location.hostname);

const Platform = (() => {
  function loadScript(src) {
    return new Promise(resolve => {
      const s = document.createElement('script');
      s.src = src;
      s.onload = () => resolve(true);
      s.onerror = () => resolve(false);
      document.head.appendChild(s);
    });
  }

  // GameDistribution reads window.GD_OPTIONS itself while its script loads —
  // there is no init() call. Ad-finished/resume is signalled via the
  // onEvent callback (SDK_GAME_START), not a promise from showAd().
  let gdPendingAdDone = null;
  if (ON_GAMEDISTRIBUTION) {
    window.GD_OPTIONS = {
      gameId: GD_GAME_ID,
      onEvent: function (event) {
        if (event.name === 'SDK_GAME_START' && gdPendingAdDone) {
          const done = gdPendingAdDone;
          gdPendingAdDone = null;
          done();
        }
      },
    };
  }

  async function init() {
    const scripts = [
      loadScript('https://sdk.crazygames.com/crazygames-sdk-v3.js'),
      loadScript('https://game-cdn.poki.com/scripts/v2/poki-sdk.js'),
    ];
    if (ON_GAMEDISTRIBUTION) {
      scripts.push(loadScript('https://html5.api.gamedistribution.com/main.min.js'));
    }
    await Promise.all(scripts);

    if (window.CrazyGames && window.CrazyGames.SDK) {
      try { await window.CrazyGames.SDK.init(); } catch (e) {}
    }
    if (window.PokiSDK) {
      try {
        await window.PokiSDK.init();
        window.PokiSDK.gameLoadingFinished();
      } catch (e) {}
    }
  }

  // A third-party SDK can throw synchronously (e.g. CrazyGames' SDK throws
  // "disabled on this domain" outside its own hosting site). Never let that
  // break our own game logic, so every SDK call is wrapped defensively.
  function safely(fn) {
    try { fn(); } catch (e) {}
  }

  function gameplayStart() {
    safely(() => { if (window.CrazyGames && window.CrazyGames.SDK) window.CrazyGames.SDK.game.gameplayStart(); });
    safely(() => { if (window.PokiSDK) window.PokiSDK.gameplayStart(); });
  }

  function gameplayStop() {
    safely(() => { if (window.CrazyGames && window.CrazyGames.SDK) window.CrazyGames.SDK.game.gameplayStop(); });
    safely(() => { if (window.PokiSDK) window.PokiSDK.gameplayStop(); });
  }

  function happytime() {
    safely(() => { if (window.CrazyGames && window.CrazyGames.SDK) window.CrazyGames.SDK.game.happytime(); });
  }

  // Requests a natural between-levels interstitial. Each SDK frequency-caps
  // these on its own, so it's safe to call on every "next level" click.
  // A fallback timer guards against a stuck or throwing ad call ever
  // blocking play.
  function midgameAd(done) {
    let finished = false;
    const finish = () => {
      if (finished) return;
      finished = true;
      done();
    };
    const timeout = setTimeout(finish, 4000);
    const wrappedFinish = () => { clearTimeout(timeout); finish(); };

    try {
      if (window.PokiSDK) {
        window.PokiSDK.gameplayStop();
        window.PokiSDK.commercialBreak(wrappedFinish);
        return;
      }
      if (window.CrazyGames && window.CrazyGames.SDK) {
        window.CrazyGames.SDK.game.gameplayStop();
        window.CrazyGames.SDK.ad.requestAd('midgame', { adFinished: wrappedFinish, adError: wrappedFinish, noAdFound: wrappedFinish });
        return;
      }
      if (window.gdsdk && typeof window.gdsdk.showAd === 'function') {
        gdPendingAdDone = wrappedFinish;
        window.gdsdk.showAd();
        return;
      }
    } catch (e) {
      wrappedFinish();
      return;
    }
    wrappedFinish();
  }

  return { init, gameplayStart, gameplayStop, happytime, midgameAd };
})();

function applyTheme(level) {
  document.body.dataset.theme = String((level - 1) % THEME_COUNT);
}

function bestKey() {
  return `memory-match-best-${state.cols}x${state.rows}`;
}

function formatTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const sec = (s % 60).toString().padStart(2, '0');
  return `${m}:${sec}`;
}

function loadBest() {
  const val = localStorage.getItem(bestKey());
  bestEl.textContent = val ? formatTime(Number(val)) : '--';
}

function saveBestIfNeeded() {
  const key = bestKey();
  const prev = localStorage.getItem(key);
  if (!prev || state.seconds < Number(prev)) {
    localStorage.setItem(key, String(state.seconds));
    return true;
  }
  return false;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startTimer() {
  stopTimer();
  state.timerId = setInterval(() => {
    state.seconds++;
    timerEl.textContent = formatTime(state.seconds);
  }, 1000);
}

function stopTimer() {
  if (state.timerId) clearInterval(state.timerId);
  state.timerId = null;
}

function buildBoard() {
  const { cols, rows } = LEVEL_TIERS[state.tierIndex];
  state.cols = cols;
  state.rows = rows;
  state.cards = [];
  state.flipped = [];
  state.matchedCount = 0;
  state.moves = 0;
  state.seconds = 0;
  state.started = false;
  state.locked = false;
  stopTimer();
  movesEl.textContent = '0';
  timerEl.textContent = '00:00';
  levelEl.textContent = state.level;
  winOverlay.classList.remove('show');
  loadBest();
  applyTheme(state.level);
  mascotIconEl.textContent = pickMascot();
  updateTitleBar();
  Platform.gameplayStart();

  const totalPairs = (cols * rows) / 2;
  const symbols = shuffle([...EMOJIS]).slice(0, totalPairs);
  const deck = shuffle([...symbols, ...symbols]);

  board.style.gridTemplateColumns = `repeat(${cols}, 80px)`;
  board.innerHTML = '';

  deck.forEach((symbol, idx) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.symbol = symbol;
    card.dataset.index = idx;
    card.innerHTML = `
      <div class="face front"></div>
      <div class="face back">${symbol}</div>
    `;
    card.addEventListener('click', () => onCardClick(card));
    board.appendChild(card);
    state.cards.push(card);
  });
}

function setupGame() {
  const [cols, rows] = difficultySelect.value.split('x').map(Number);
  const idx = LEVEL_TIERS.findIndex(t => t.cols === cols && t.rows === rows);
  state.tierIndex = idx === -1 ? 0 : idx;
  state.level = 1;
  buildBoard();
}

function nextLevel() {
  state.level++;
  buildBoard();
}

function onCardClick(card) {
  if (state.locked) return;
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (state.flipped.length === 2) return;

  if (!state.started) {
    state.started = true;
    startTimer();
  }

  card.classList.add('flipped');
  state.flipped.push(card);
  playFlip();

  if (state.flipped.length === 2) {
    state.moves++;
    movesEl.textContent = state.moves;
    const [a, b] = state.flipped;
    if (a.dataset.symbol === b.dataset.symbol) {
      a.classList.add('matched');
      b.classList.add('matched');
      playMatch();
      state.matchedCount += 2;
      state.flipped = [];
      if (state.matchedCount === state.cards.length) {
        onWin();
      }
    } else {
      state.locked = true;
      setTimeout(() => {
        a.classList.add('wrong');
        b.classList.add('wrong');
      }, 50);
      setTimeout(() => {
        a.classList.remove('flipped', 'wrong');
        b.classList.remove('flipped', 'wrong');
        state.flipped = [];
        state.locked = false;
      }, 700);
    }
  }
}

function onWin() {
  stopTimer();
  playWin();
  Platform.gameplayStop();
  Platform.happytime();
  const dict = I18N[state.lang] || I18N.en;
  winStatsEl.textContent = dict.winStats
    .replace('{time}', formatTime(state.seconds))
    .replace('{moves}', state.moves);
  const isNewBest = saveBestIfNeeded();
  newBestEl.textContent = isNewBest ? dict.newBest : '';
  loadBest();
  setTimeout(() => winOverlay.classList.add('show'), 400);
}

restartBtn.addEventListener('click', setupGame);
playAgainBtn.addEventListener('click', () => Platform.midgameAd(nextLevel));
difficultySelect.addEventListener('change', setupGame);
muteBtn.addEventListener('click', () => {
  state.muted = !state.muted;
  localStorage.setItem('memory-match-muted', state.muted ? '1' : '0');
  updateMuteBtn();
});
languageSelect.addEventListener('change', () => {
  state.lang = languageSelect.value;
  localStorage.setItem('memory-match-lang', state.lang);
  applyI18n();
});

state.lang = detectLanguage();
populateLanguageSelect();
languageSelect.value = state.lang;
applyI18n();
updateMuteBtn();
initCritterLanes();
setupGame();
Platform.init().then(() => Platform.gameplayStart());
</script>
</body>
